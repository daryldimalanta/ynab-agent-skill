[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ynab-agent-skill"
dynamic = ["version"]
description = "Local guarded YNAB budget and transaction workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: MacOS", "Programming Language :: Python :: 3.12"]
dependencies = []

[project.scripts]
ynab-agent-skill = "budget_tools.cli:main"
ynab-codex-skill = "budget_tools.cli:main"

[tool.setuptools]
packages = ["budget_tools"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "budget_tools.__version__"}

[dependency-groups]
dev = ["build==1.3.0", "ruff==0.14.0", "mypy==1.18.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
files = ["budget_tools/errors.py", "budget_tools/transaction_workflow.py",
         "budget_tools/purchases.py", "budget_tools/purchase_memos.py", "budget_tools/purchase_workflow.py"]
follow_imports = "silent"
strict = true
